{% extends "base.html" %}
{% block content %}

<div class="d-flex justify-content-between align-items-end mb-5 border-bottom border-subtle pb-3 fade-in-up delay-100">
    <div>
        <h2 class="page-title mb-1">Discover Books</h2>
        <p class="text-bmb-muted mb-0">Explore what your campus is reading.</p>
    </div>
    <div class="d-flex align-items-center gap-3">
        <input class="form-control bmb-input rounded-pill px-4 py-2 hover-lift shadow-sm" type="search" 
               name="q" placeholder="Type to search books, authors..." 
               hx-get="{{ url_for('books.search') }}" 
               hx-trigger="keyup changed delay:500ms, search" 
               hx-target="#book-grid" style="min-width: 250px;">
        <a href="{{ url_for('books.upload') }}" class="btn btn-primary-gradient rounded-pill px-4 py-2 text-nowrap shadow hover-lift">
            <i class="bi bi-plus-lg me-1"></i> Post a Book
        </a>
    </div>
</div>

<div id="book-grid" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4 pb-5">
    {% include "books/partials/book_grid.html" %}
</div>

{% endblock %}
